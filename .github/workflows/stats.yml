name: refresh stats
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query GitHub GraphQL and update stats.json
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.STATS_PAT != '' }}
        run: |
          set -e
          q='query { user(login: "Pranav0494") { pullRequests { totalCount } issues { totalCount } contributionsCollection { contributionCalendar { totalContributions } } } }'
          if ! resp=$(gh api graphql -f query="$q" 2>&1); then
            echo "GraphQL query failed: $resp"
            # A rejected PAT must be loud — silently keeping stale numbers is worse than failing.
            [ "$HAS_PAT" = "true" ] && { echo "::error::STATS_PAT was rejected. Regenerate the token and re-set the secret."; exit 1; }
            echo "No PAT configured; keeping existing stats."
            exit 0
          fi
          contrib=$(echo "$resp" | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          if [ "$HAS_PAT" = "true" ]; then
            # PAT sees private repos: refresh every number
            # restrictedContributionsCount lumps private PRs/issues/reviews in with commits, so count commits directly
            since=$(date -u -d '1 year ago' +%F)
            m=$(gh api -X GET search/commits -f q="author:Pranav0494 author-date:>=$since" --jq .total_count)
            jq -n \
              --argjson c "$contrib" \
              --argjson p "$(echo "$resp" | jq '.data.user.pullRequests.totalCount')" \
              --argjson i "$(echo "$resp" | jq '.data.user.issues.totalCount')" \
              --argjson m "$m" \
              '{contributions: $c, commits_last_year: $m, total_prs: $p, total_issues: $i}' > stats.json
          else
            # default token only sees the public calendar: refresh contributions, keep the rest
            jq --argjson c "$contrib" '.contributions = $c' stats.json > stats.tmp && mv stats.tmp stats.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stats.json
          git commit -m "chore: refresh stats.json" || echo "stats unchanged"
          git push
